<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐢 CHAT DO DYOU</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --primary: #10a37f;
            --blue: #0066cc;
            --bg: #ffffff;
            --bg-secondary: #f8f8f8;
            --text: #333333;
            --border: #e0e0e0;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        
        /* ===== LOGIN ===== */
        .login-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #10a37f, #0066cc);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        
        .logo { font-size: 50px; }
        .login-card h1 { font-size: 22px; color: #333; margin: 5px 0; }
        .subtitle { color: #666; font-size: 13px; margin-bottom: 20px; }
        
        .login-btn {
            width: 100%;
            padding: 13px;
            border: 2px solid #ddd;
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            background: white;
            transition: all 0.2s;
        }
        
        .login-btn:hover { background: #f5f5f5; }
        .login-btn.google { border-color: #4285f4; color: #4285f4; }
        .login-btn.email { border-color: #10a37f; color: #10a37f; }
        .login-btn.anon { border-color: #ff8800; color: #ff8800; }
        
        .email-form { display: none; text-align: left; }
        .email-form.active { display: block; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { font-size: 12px; font-weight: 600; color: #555; display: block; margin-bottom: 3px; }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .form-group input:focus { border-color: var(--primary); outline: none; }
        
        .form-actions { display: flex; gap: 8px; margin-top: 15px; }
        .form-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        .btn-submit { background: var(--primary); color: white; }
        .btn-back { background: #e0e0e0; color: #333; }
        
        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 260px;
            background: #f5f5f5;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        
        .sidebar-header {
            padding: 15px;
            background: var(--primary);
            color: white;
            text-align: center;
            font-weight: bold;
        }
        
        .user-info {
            padding: 10px;
            background: #e8e8e8;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }
        
        .user-avatar {
            width: 30px; height: 30px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .user-name { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .logout-btn {
            background: #cc0000;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 10px;
        }
        
        .new-chat-btn {
            margin: 10px;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .conversation-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        
        .conversation-item {
            padding: 10px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
        }
        
        .conversation-item.active {
            border-color: var(--primary);
            background: #e8f5e9;
        }
        
        .conversation-title {
            flex: 1;
            cursor: pointer;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .conversation-actions {
            display: flex;
            gap: 3px;
        }
        
        .conversation-actions button {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 13px;
            padding: 2px 4px;
        }
        
        .conversation-actions button:hover { transform: scale(1.2); }
        
        /* ===== CHAT ===== */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .chat-header {
            padding: 10px 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .chat-title { font-size: 14px; color: #666; cursor: pointer; }
        
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        
        .msg {
            max-width: 85%;
            margin: 8px 0;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .msg.user { background: var(--blue); color: white; margin-left: auto; }
        .msg.bot { background: var(--bg-secondary); color: var(--text); margin-right: auto; }
        .msg.sys { background: #fff3e0; color: #ff8800; text-align: center; margin: 8px auto; font-size: 12px; }
        
        .code-block {
            background: #1e1e1e;
            border-radius: 8px;
            margin: 8px 0;
            overflow: hidden;
        }
        
        .code-header {
            background: #2d2d2d;
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
        }
        
        .code-language { color: #10a37f; font-size: 10px; font-weight: bold; }
        
        .code-actions button {
            padding: 3px 6px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 9px;
            margin-left: 3px;
        }
        
        .copy-code-btn { background: #10a37f; color: white; }
        .download-code-btn { background: #0066cc; color: white; }
        
        .code-content { padding: 10px; overflow-x: auto; }
        .code-content pre {
            margin: 0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #d4d4d4;
            white-space: pre-wrap;
        }
        
        .input-area {
            padding: 10px 15px;
            border-top: 1px solid var(--border);
        }
        
        .input-row { display: flex; gap: 6px; align-items: flex-end; }
        
        .attach-btn {
            background: #e0e0e0;
            border: none;
            border-radius: 50%;
            width: 38px; height: 38px;
            font-size: 16px;
            cursor: pointer;
            flex-shrink: 0;
        }
        
        .input-field {
            flex: 1;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            resize: none;
            min-height: 40px;
            max-height: 80px;
            font-family: inherit;
        }
        
        .input-field:focus { border-color: var(--primary); }
        
        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px; height: 40px;
            font-size: 16px;
            cursor: pointer;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <div class="logo">🐢</div>
            <h1>CHAT DO DYOU</h1>
            <p class="subtitle">Crie sua conta ou use anonimamente</p>
            
            <div id="loginOptions">
                <button class="login-btn google" onclick="loginGoogle()">🔵 Google</button>
                <button class="login-btn email" onclick="mostrarCriar()">✉️ Criar Conta</button>
                <button class="login-btn email" onclick="mostrarLogin()" style="border-color:#0066cc;color:#0066cc">🔑 Login</button>
                <button class="login-btn anon" onclick="loginAnonimo()">👤 Anônimo</button>
            </div>
            
            <div class="email-form" id="formCriar">
                <h3>✉️ Criar Conta</h3>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="emailCriar" placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label>Senha:</label>
                    <input type="password" id="senhaCriar" placeholder="Mín 6, 1 maiúscula, 1 minúscula, 1 número">
                </div>
                <div class="form-group">
                    <label>Confirmar Senha:</label>
                    <input type="password" id="confirmarSenha" placeholder="Confirme">
                </div>
                <div class="form-actions">
                    <button class="btn-back" onclick="voltar()">←</button>
                    <button class="btn-submit" onclick="criarConta()">Criar</button>
                </div>
            </div>
            
            <div class="email-form" id="formLogin">
                <h3>🔑 Login</h3>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="emailLogin" placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label>Senha:</label>
                    <input type="password" id="senhaLogin" placeholder="Sua senha">
                </div>
                <div class="form-actions">
                    <button class="btn-back" onclick="voltar()">←</button>
                    <button class="btn-submit" onclick="fazerLogin()">Entrar</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- CHAT -->
    <div class="sidebar" id="sidebar" style="display:none">
        <div class="sidebar-header">🐢 CHAT DO DYOU</div>
        <div class="user-info">
            <div class="user-avatar" id="userAvatar">?</div>
            <span class="user-name" id="userName">...</span>
            <button class="logout-btn" onclick="sair()">🚪 Sair</button>
        </div>
        <button class="new-chat-btn" onclick="novaConversa()">➕ Nova Conversa</button>
        <div class="conversation-list" id="conversationList"></div>
    </div>
    
    <div class="main-area" id="mainArea" style="display:none">
        <div class="chat-header">
            <span class="chat-title" id="chatTitle">💬 Nova Conversa</span>
        </div>
        <div class="chat-area" id="chatArea"></div>
        <div class="input-area">
            <div class="input-row">
                <button class="attach-btn" onclick="anexarArquivo()">📎</button>
                <textarea class="input-field" id="inputField" rows="1" placeholder="Digite..."></textarea>
                <button class="send-btn" onclick="enviar()">➤</button>
            </div>
        </div>
    </div>
    
    <input type="file" id="fileInput" style="display:none" multiple onchange="lerArquivos(event)">
    
    <script>
        // ===== FIREBASE =====
        const firebaseConfig = {
            apiKey: "AIzaSyDlf6NDwrz033RRuGWRC7v7bL1Pl7AqgmQ",
            authDomain: "chat-dyou.firebaseapp.com",
            projectId: "chat-dyou",
            storageBucket: "chat-dyou.firebasestorage.app",
            messagingSenderId: "793764714256",
            appId: "1:793764714256:web:23c3e8256f53bd0ce7f795"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        const CHAVE_GROQ = "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";
        let conversas = {};
        let conversaAtual = null;
        let contador = 0;
        let historico = [];
        let usuario = null;
        
        // ===== LOGIN =====
        function mostrarCriar() { document.getElementById('loginOptions').style.display='none'; document.getElementById('formCriar').classList.add('active'); }
        function mostrarLogin() { document.getElementById('loginOptions').style.display='none'; document.getElementById('formLogin').classList.add('active'); }
        function voltar() { document.getElementById('loginOptions').style.display='block'; document.querySelectorAll('.email-form').forEach(f=>f.classList.remove('active')); }
        
        function loginGoogle() {
            auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
                .then(r => { usuario = r.user; entrar(); })
                .catch(e => alert(e.message));
        }
        
        function loginAnonimo() {
            auth.signInAnonymously()
                .then(r => { usuario = r.user; entrar(); })
                .catch(() => { usuario = {uid:'anon_'+Date.now(), isAnonymous:true}; entrar(); });
        }
        
        function criarConta() {
            const email = document.getElementById('emailCriar').value.trim();
            const senha = document.getElementById('senhaCriar').value;
            const conf = document.getElementById('confirmarSenha').value;
            
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return alert('Email inválido!');
            if (!/[a-z]/.test(senha)) return alert('Falta letra minúscula!');
            if (!/[A-Z]/.test(senha)) return alert('Falta letra maiúscula!');
            if (!/[0-9]/.test(senha)) return alert('Falta número!');
            if (senha.length < 6) return alert('Mínimo 6 caracteres!');
            if (senha !== conf) return alert('Senhas não coincidem!');
            
            auth.createUserWithEmailAndPassword(email, senha)
                .then(r => { usuario = r.user; entrar(); })
                .catch(e => alert(e.code === 'auth/email-already-in-use' ? 'Email já cadastrado!' : e.message));
        }
        
        function fazerLogin() {
            const email = document.getElementById('emailLogin').value.trim();
            const senha = document.getElementById('senhaLogin').value;
            if (!email || !senha) return alert('Preencha todos os campos!');
            
            auth.signInWithEmailAndPassword(email, senha)
                .then(r => { usuario = r.user; entrar(); })
                .catch(e => alert(e.code === 'auth/user-not-found' ? 'Conta não encontrada!' : e.code === 'auth/wrong-password' ? 'Senha incorreta!' : e.message));
        }
        
        function sair() {
            if (confirm('Sair?')) {
                auth.signOut();
                usuario = null;
                conversas = {};
                document.getElementById('loginScreen').style.display = 'flex';
                document.getElementById('sidebar').style.display = 'none';
                document.getElementById('mainArea').style.display = 'none';
                voltar();
            }
        }
        
        function entrar() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('sidebar').style.display = 'flex';
            document.getElementById('mainArea').style.display = 'flex';
            
            const nome = usuario.displayName || usuario.email || 'Anônimo';
            document.getElementById('userName').textContent = nome;
            document.getElementById('userAvatar').textContent = nome.charAt(0).toUpperCase();
            
            carregar();
        }
        
        // ===== FIREBASE =====
        function carregar() {
            if (!usuario || usuario.isAnonymous) { novaConversa(); return; }
            
            db.collection('usuarios').doc(usuario.uid).collection('conversas')
                .orderBy('timestamp', 'desc').get()
                .then(snap => {
                    if (snap.empty) { novaConversa(); return; }
                    snap.forEach(d => { conversas[d.id] = d.data().mensagens || []; });
                    const primeira = Object.keys(conversas)[0];
                    primeira ? trocar(primeira) : novaConversa();
                })
                .catch(() => novaConversa());
        }
        
        function salvar() {
            if (!usuario || usuario.isAnonymous || !conversaAtual) return;
            db.collection('usuarios').doc(usuario.uid).collection('conversas')
                .doc(conversaAtual).set({
                    mensagens: conversas[conversaAtual] || [],
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                }).catch(()=>{});
        }
        
        // ===== CONVERSAS =====
        function novaConversa() {
            contador++;
            conversaAtual = 'Conversa ' + contador;
            conversas[conversaAtual] = [];
            historico = [];
            document.getElementById('chatTitle').textContent = '💬 ' + conversaAtual;
            document.getElementById('chatArea').innerHTML = '';
            addMsg('🐢 Bem-vindo!', 'sys');
            listar();
        }
        
        function listar() {
            const lista = document.getElementById('conversationList');
            lista.innerHTML = '';
            for (const nome in conversas) {
                const item = document.createElement('div');
                item.className = 'conversation-item' + (nome === conversaAtual ? ' active' : '');
                
                const titulo = document.createElement('span');
                titulo.className = 'conversation-title';
                titulo.textContent = nome;
                titulo.onclick = () => trocar(nome);
                
                const acoes = document.createElement('div');
                acoes.className = 'conversation-actions';
                
                const btnRen = document.createElement('button');
                btnRen.textContent = '✏️';
                btnRen.title = 'Renomear';
                btnRen.onclick = (e) => { e.stopPropagation(); renomear(nome); };
                
                const btnDel = document.createElement('button');
                btnDel.textContent = '🗑️';
                btnDel.title = 'Excluir';
                btnDel.onclick = (e) => { e.stopPropagation(); excluir(nome); };
                
                acoes.appendChild(btnRen);
                acoes.appendChild(btnDel);
                item.appendChild(titulo);
                item.appendChild(acoes);
                lista.appendChild(item);
            }
        }
        
        function trocar(nome) {
            conversaAtual = nome;
            document.getElementById('chatTitle').textContent = '💬 ' + nome;
            document.getElementById('chatArea').innerHTML = '';
            historico = [];
            for (const msg of conversas[nome]) {
                exibirMsg(msg.texto, msg.tipo);
                if (msg.tipo === 'user') historico.push({role:'user', content:msg.texto});
                else if (msg.tipo === 'bot') historico.push({role:'assistant', content:msg.texto});
            }
            listar();
        }
        
        function renomear(nome) {
            const novo = prompt('Novo nome:', nome);
            if (novo && novo.trim() && novo !== nome) {
                conversas[novo] = conversas[nome];
                delete conversas[nome];
                if (conversaAtual === nome) {
                    conversaAtual = novo;
                    document.getElementById('chatTitle').textContent = '💬 ' + novo;
                }
                listar();
                salvar();
            }
        }
        
        function excluir(nome) {
            if (confirm('Excluir "' + nome + '"?')) {
                delete conversas[nome];
                if (conversaAtual === nome) novaConversa();
                else listar();
            }
        }
        
        // ===== MENSAGENS =====
        function parseMarkdown(texto) {
            const linhas = texto.split('\n');
            let html = '';
            let codigo = false, lang = '', buffer = [];
            
            for (const linha of linhas) {
                if (linha.trim().startsWith('```')) {
                    if (codigo) {
                        html += blocoCodigo(buffer.join('\n'), lang);
                        buffer = []; codigo = false;
                    } else {
                        codigo = true;
                        lang = linha.replace(/```/g,'').trim() || 'code';
                    }
                    continue;
                }
                if (codigo) { buffer.push(linha); continue; }
                
                let l = linha.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
                if (linha.startsWith('## ')) l = '<strong>' + linha.substring(3) + '</strong>';
                l = l.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                if (!linha.trim()) l = '<br>';
                html += l;
            }
            return html;
        }
        
        function blocoCodigo(codigo, lang) {
            return '<div class="code-block"><div class="code-header"><span class="code-language">' + lang + '</span><div class="code-actions"><button class="copy-code-btn" onclick="copiar(this)">📋</button><button class="download-code-btn" onclick="baixar(this)">⬇️</button></div></div><div class="code-content"><pre>' + codigo.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</pre></div></div>';
        }
        
        function copiar(btn) {
            navigator.clipboard.writeText(btn.closest('.code-block').querySelector('pre').textContent);
            btn.textContent = '✅';
            setTimeout(() => btn.textContent = '📋', 2000);
        }
        
        function baixar(btn) {
            const codigo = btn.closest('.code-block').querySelector('pre').textContent;
            const blob = new Blob([codigo], {type:'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'codigo.txt';
            a.click();
        }
        
        function exibirMsg(texto, tipo) {
            const div = document.createElement('div');
            div.className = 'msg ' + tipo;
            if (tipo === 'bot') div.innerHTML = parseMarkdown(texto);
            else div.textContent = texto;
            document.getElementById('chatArea').appendChild(div);
        }
        
        function addMsg(texto, tipo) {
            exibirMsg(texto, tipo);
            document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
            if (conversaAtual && conversas[conversaAtual]) {
                conversas[conversaAtual].push({texto, tipo});
                salvar();
            }
        }
        
        // ===== ENVIO =====
        async function enviar() {
            const input = document.getElementById('inputField');
            const msg = input.value.trim();
            if (!msg) return;
            
            addMsg(msg, 'user');
            input.value = '';
            historico.push({role:'user', content:msg});
            
            const lower = msg.toLowerCase();
            if (lower.includes('imagem') || lower.includes('foto') || lower.includes('desenho')) {
                gerarImagem(msg.replace(/imagem:|imagem de|gerar imagem|foto de|desenho/gi,'').trim());
                return;
            }
            
            responder();
        }
        
        async function responder() {
            addMsg('⏳...', 'sys');
            try {
                const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {'Authorization': 'Bearer ' + CHAVE_GROQ, 'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        model: 'openai/gpt-oss-20b',
                        messages: [
                            {role:'system', content:'Responda em português. Use ``` para código.'},
                            ...historico.slice(-10)
                        ],
                        max_tokens: 2000
                    })
                });
                const data = await resp.json();
                let resposta = data.choices[0].message.content.replace(/<think>.*?<\/think>/gs,'').trim();
                historico.push({role:'assistant', content:resposta});
                limparLoading();
                addMsg(resposta, 'bot');
            } catch {
                limparLoading();
                addMsg('❌ Erro', 'sys');
            }
        }
        
        async function gerarImagem(prompt) {
            addMsg('🎨...', 'sys');
            const url = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt) + '?width=512&height=512&nologo=true';
            const div = document.createElement('div');
            div.className = 'msg bot';
            div.innerHTML = '<img src="' + url + '" style="max-width:100%;border-radius:10px" onclick="window.open(this.src)">';
            document.getElementById('chatArea').appendChild(div);
            limparLoading();
        }
        
        function limparLoading() {
            document.querySelectorAll('.msg.sys').forEach(m => {
                if (m.textContent.includes('⏳') || m.textContent.includes('🎨')) m.remove();
            });
        }
        
        // ===== TECLADO =====
        document.getElementById('inputField').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); }
        });
        
        function anexarArquivo() { document.getElementById('fileInput').click(); }
        function lerArquivos(e) {
            for (const f of e.target.files) addMsg('📎 ' + f.name, 'sys');
            e.target.value = '';
        }
    </script>
</body>
</html>
